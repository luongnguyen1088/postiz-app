name: Build & Deploy to Dokploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.1devtool/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-dokploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/postiz-app" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Redeploy
        if: success()
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -n "$DOKPLOY_API_KEY" ]; then
            echo "Triggering Dokploy redeploy via API..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://do2.claro.vn/api/compose.redeploy" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -d "{\"composeId\": \"L2NjD011SQyEKUcDW2nnU\", \"title\": \"GitHub Actions deploy: ${{ github.sha }}\"}"
            )
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP Status: $HTTP_STATUS"
            echo "Response: $BODY"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Dokploy redeploy triggered successfully."
            else
              echo "Warning: Dokploy redeploy returned status $HTTP_STATUS"
            fi
          else
            echo "DOKPLOY_API_KEY secret is not configured in GitHub Repository Secrets yet."
            echo "Skipping automatic Dokploy webhook trigger. Dokploy can be redeployed manually or after adding DOKPLOY_API_KEY."
          fi
